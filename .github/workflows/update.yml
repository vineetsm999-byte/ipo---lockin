name: Update lock-in data

on:
  schedule:
    - cron: "30 13 * * 1-5"   # 19:00 IST, Monday to Friday
  workflow_dispatch:           # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Scrape Chittorgarh and merge into lockin_data.csv
        run: python lockin_scrape.py

      - name: Commit if data changed
        run: |
          git config user.name "lockin-bot"
          git config user.email "lockin-bot@users.noreply.github.com"
          git add lockin_data.csv
          git diff --cached --quiet || (git commit -m "Update lock-in data $(date -u +%F)" && git push)
